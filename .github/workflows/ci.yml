name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # Every actor call crosses loopback TCP between RivetKit's runner and its engine, and the
      # runner doesn't set TCP_NODELAY (rivetkit 2.3.21), so each one waits ~40 ms on a delayed ACK.
      # Quick ACKs on loopback cut the test run by about a third. Speed only: if the route
      # can't be changed, the tests still pass.
      - name: Quick ACKs on loopback
        run: |
          sudo ip route change local 127.0.0.0/8 dev lo proto kernel scope host src 127.0.0.1 quickack 1 &&
          sudo ip route change local 127.0.0.1 dev lo proto kernel scope host src 127.0.0.1 quickack 1 ||
          echo "::warning::couldn't turn on quick ACKs on loopback; the tests will be slower"
      - run: bun run typecheck
      - run: bun run lint
      # `bun run test`'s 12 workers each start a server and an engine. On the runner, more than two at
      # once stall the engines (an actor's creation or a room's events wait 30 s), so two here.
      - run: bun test --timeout 60000 --parallel=2

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve the existing macOS check name for branch protection.
          - os: macos-15
            name: desktop
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      # Regenerates the protocol fixture from the TS types; the Rust side must decode it (cargo test).
      - run: bun test app/helper/test/protocol.test.ts app/helper/test/platform-paths.test.ts
      - run: git diff --exit-code app/desktop/src-tauri/tests/fixtures
      # The build checks the sidecar exists.
      - run: bun app/desktop/scripts/helper.ts
      - working-directory: app/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # release-please reads conventional commits to pick the version bump.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
