# release-please keeps a Release PR open with the next version + changelog.
# Merging it tags vX.Y.Z and creates the GitHub Release; the jobs below then
# build, sign and notarize the desktop app, attach it, and bump the Homebrew cask.
# Railway deploys the server from main on its own.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please links each change to its commit but not to who made it: credit the authors
  # on the release PR, so the changelog and "What's new" in the game name them. Runs again
  # whenever release-please rewrites the PR.
  credit:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun server/scripts/changelog-authors.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git diff --quiet CHANGELOG.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: credit changelog authors"
          git push

  # The desktop app: a universal build, signed, notarized, and its updater archive signed; the
  # .dmg, .app.tar.gz, .sig and latest.json go on this release, where installed apps look for updates.
  app:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      # tauri-action merges into an existing latest.json and keeps its darwin signatures, so a rerun would
      # replace the update archive but leave the old run's signature on it: start this release's afresh.
      - name: Drop latest.json from a previous run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx latest.json; then
            gh release delete-asset "$TAG" latest.json --yes
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKENMAXXING_SERVER_URL: ${{ vars.TOKENMAXXING_SERVER_URL }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          # Losing this key means installed apps can never update again: keep it in the password manager.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/desktop
          tauriScript: bunx tauri
          tagName: ${{ needs.release-please.outputs.tag }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin
      # Tauri notarizes the app inside the .dmg, not the .dmg: notarize and staple that too, so what
      # people download passes Gatekeeper as a whole (and offline), then put it back on the release.
      # Also as Tokenmaxxing.dmg: a name without the version, so releases/latest/download/Tokenmaxxing.dmg
      # (the website's Download button) is always the newest installer.
      - name: Notarize the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          # stapler looks the ticket up on Apple's CloudKit, which drops connections now and then.
          retry() { for _ in 1 2 3; do "$@" && return; sleep 20; done; return 1; }
          dir=$(mktemp -d)
          dmg="$dir/Tokenmaxxing_${VERSION}_universal.dmg"
          gh release download "$TAG" --pattern "$(basename "$dmg")" --dir "$dir"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          retry xcrun stapler staple "$dmg"
          cp "$dmg" "$dir/Tokenmaxxing.dmg"
          gh release upload "$TAG" "$dmg" "$dir/Tokenmaxxing.dmg" --clobber
      # What someone clicking Download gets: this version, and macOS must accept the disk image and the
      # app in it without a warning, and the sync helper must keep the entitlements it needs to run.
      - name: Check the installer passes Gatekeeper
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          # stapler looks the ticket up on Apple's CloudKit, which drops connections now and then.
          retry() { for _ in 1 2 3; do "$@" && return; sleep 20; done; return 1; }
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/installer.dmg" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Tokenmaxxing.dmg"
          spctl -a -vv -t open --context context:primary-signature "$dir/installer.dmg"
          retry xcrun stapler validate "$dir/installer.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$dir/mnt" "$dir/installer.dmg"
          app="$dir/mnt/Tokenmaxxing.app"
          test "$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString)" = "$VERSION"
          codesign --verify --deep --strict -vv "$app"
          retry xcrun stapler validate "$app"
          spctl -a -vv -t exec "$app"
          codesign -d --entitlements - "$app/Contents/MacOS/tokenmaxxing-helper" | grep -q allow-jit
          hdiutil detach "$dir/mnt"
      # Installed apps only take an update signed by the key whose public half they ship with
      # (tauri.conf.json). Check the one just published, as they'll see it: a wrong signing secret
      # fails this job instead of quietly stopping every app from updating.
      - name: Check the update installed apps will get
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          brew install minisign
          dir=$(mktemp -d)
          jq -r '.plugins.updater.pubkey' app/desktop/src-tauri/tauri.conf.json | base64 -d > "$dir/key.pub"
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" -o "$dir/latest.json"
          jq -e --arg v "$VERSION" '.version == $v or .version == "v" + $v' "$dir/latest.json"
          for platform in darwin-aarch64 darwin-x86_64; do
            curl -fsSL "$(jq -er --arg p "$platform" '.platforms[$p].url' "$dir/latest.json")" -o "$dir/update"
            jq -er --arg p "$platform" '.platforms[$p].signature' "$dir/latest.json" | base64 -d > "$dir/update.minisig"
            minisign -V -p "$dir/key.pub" -m "$dir/update" -x "$dir/update.minisig"
          done

  # The CLI for linked computers (ARCHITECTURE.md, "Linked computers"): a binary per platform and their checksums on this
  # release, where the server's /install.sh downloads them from. On a Mac, so Bun signs the Mac ones.
  cli:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bash app/helper/scripts/cli.sh dist/cli
      - name: Check the build is this version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: test "$(dist/cli/tokenmaxxing-darwin-arm64 --version)" = "$VERSION"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/cli/* --clobber

  cask:
    needs: [release-please, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the cask with this release's checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern "Tokenmaxxing_${VERSION}_universal.dmg" --dir dist
          export SHA=$(sha256sum "dist/Tokenmaxxing_${VERSION}_universal.dmg" | cut -d' ' -f1)
          envsubst '$VERSION $SHA' < packaging/tokenmaxxing.rb > tokenmaxxing.rb
      - name: Push to the tap
        env:
          # Write deploy key on HansKristoffer/homebrew-tap only.
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          install -m 600 /dev/null ~/tap_key && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:HansKristoffer/homebrew-tap.git tap
          mkdir -p tap/Casks && cp tokenmaxxing.rb tap/Casks/tokenmaxxing.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tokenmaxxing.rb
          git commit -m "tokenmaxxing $VERSION"
          git push
