[test]
# Teardown for the test server (server/test/rivet.ts): a preload's afterAll runs once after the
# whole run, or after each file with `--parallel` (`bun run test`), where every file starts its own.
preload = ["./server/test/cleanup.ts"]

[fmt]
# The style Biome's formatter had: Prettier's defaults (two spaces, double quotes, semicolons,
# trailing commas) at 110 columns. Biome still lints (biome.json).
printWidth = 110
